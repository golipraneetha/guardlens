<svg viewBox="0 0 900 1750" xmlns="http://www.w3.org/2000/svg" role="img">
<title>GuardLens architecture diagram (vertical, single-column layout)</title>
<desc>Incoming prompts pass through a frozen guardrail classifier; approved traffic flows through GuardLens's embedding, sliding window, HDBSCAN clustering, cluster registry, emergence scoring, and Top-K analyst queue, with an optional LLM-based verifier and feedback path to the analyst.</desc>
<rect width="900" height="1750" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
  </marker>
</defs>
<style>
  .box-title { font-family: 'Times New Roman', Georgia, serif; font-weight: 700; font-size: 24px; fill: #000000; text-anchor: middle; }
  .box-sub { font-family: 'Times New Roman', Georgia, serif; font-style: italic; font-size: 16px; fill: #000000; text-anchor: middle; }
  .lbl { font-family: 'Times New Roman', Georgia, serif; font-style: italic; font-size: 17px; fill: #000000; text-anchor: middle; }
  .lbl-l { font-family: 'Times New Roman', Georgia, serif; font-style: italic; font-size: 16px; fill: #000000; text-anchor: start; }
  .sec { font-family: 'Times New Roman', Georgia, serif; font-weight: 700; font-size: 17px; fill: #000000; letter-spacing: 0.5px; }
  .big { font-family: 'Times New Roman', Georgia, serif; font-weight: 700; font-size: 24px; fill: #000000; text-anchor: middle; }
</style>

<text x="330" y="30" class="big">Incoming User Prompts</text>
<line x1="330" y1="42" x2="330" y2="68" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="110" y="72" width="440" height="100" rx="9" fill="#f0f0f0" stroke="#000" stroke-width="2.2" stroke-dasharray="9,5"/>
<text x="330" y="112" class="box-title" font-size="20">Existing Safety Guardrail</text>
<text x="330" y="137" class="box-title" font-size="20">Classifier</text>
<text x="330" y="160" class="box-sub" font-size="15">Frozen · DeBERTa Prompt Injection v2</text>

<line x1="110" y1="122" x2="30" y2="122" stroke="#000" stroke-width="2.2"/>
<line x1="30" y1="122" x2="30" y2="290" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="30" y="315" class="lbl" font-size="14">Blocked</text>
<text x="30" y="335" class="lbl" font-size="14">(discarded)</text>

<line x1="330" y1="172" x2="330" y2="222" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="400" y="200" class="lbl" font-size="14">Approved</text>

<rect x="60" y="228" width="740" height="1220" fill="none" stroke="#000" stroke-width="2.2" stroke-dasharray="9,5"/>
<text x="85" y="255" class="sec">GUARDLENS — POST-DEPLOYMENT MONITORING LAYER</text>

<rect x="110" y="270" width="440" height="90" rx="9" fill="#ffffff" stroke="#000" stroke-width="2.2"/>
<text x="330" y="308" class="box-title" font-size="19">Sentence Embedding Model</text>
<text x="330" y="333" class="box-sub" font-size="14">all-MiniLM-L6-v2 · 384-dim, L2-norm</text>

<line x1="330" y1="360" x2="330" y2="400" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="110" y="405" width="440" height="90" rx="9" fill="#ffffff" stroke="#000" stroke-width="2.2"/>
<text x="330" y="443" class="box-title" font-size="19">Sliding Window Buffer</text>
<text x="330" y="468" class="box-sub" font-size="14">Last W = 3 cycles of approved traffic</text>

<line x1="330" y1="495" x2="330" y2="535" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="110" y="540" width="440" height="90" rx="9" fill="#ffffff" stroke="#000" stroke-width="2.2"/>
<text x="330" y="572" class="box-title" font-size="19">HDBSCAN Semantic Clustering</text>
<text x="330" y="600" class="box-sub" font-size="14">min_cluster_size = 5 · EOM selection</text>

<line x1="330" y1="630" x2="330" y2="670" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="110" y="675" width="440" height="90" rx="9" fill="#ffffff" stroke="#000" stroke-width="2.2"/>
<text x="330" y="713" class="box-title" font-size="19">Cluster Registry</text>
<text x="330" y="738" class="box-sub" font-size="14">Cross-cycle identity via cosine ≥ 0.85</text>

<line x1="330" y1="765" x2="330" y2="805" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="110" y="810" width="440" height="90" rx="9" fill="#ffffff" stroke="#000" stroke-width="2.2"/>
<text x="330" y="848" class="box-title" font-size="19">Emergence Score</text>
<text x="330" y="873" class="box-sub" font-size="14">E = Density × max(Growth,0.1) × Novelty</text>

<path d="M 550 720 C 660 720, 660 855, 550 855" fill="none" stroke="#000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="675" y="792" class="lbl-l" font-size="13">historical</text>
<text x="675" y="810" class="lbl-l" font-size="13">centroids</text>

<line x1="330" y1="900" x2="330" y2="940" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="110" y="945" width="440" height="90" rx="9" fill="#ffffff" stroke="#000" stroke-width="2.2"/>
<text x="330" y="983" class="box-title" font-size="19">Top-K Analyst Queue</text>
<text x="330" y="1008" class="box-sub" font-size="14">Fixed budget · K = 3 clusters / cycle</text>

<line x1="550" y1="990" x2="605" y2="990" stroke="#000" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<rect x="615" y="945" width="165" height="90" rx="9" fill="#ffffff" stroke="#000" stroke-width="2.2" stroke-dasharray="3,3"/>
<text x="697" y="978" class="box-title" font-size="15">LLM</text>
<text x="697" y="1000" class="box-title" font-size="15">Verifier</text>
<text x="697" y="1022" class="box-sub" font-size="12">Optional</text>

<line x1="330" y1="1035" x2="330" y2="1310" stroke="#000" stroke-width="2.2" marker-end="url(#arrow)"/>

<path d="M 697 1035 L 697 1170 L 435 1170" fill="none" stroke="#000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="565" y="1155" class="lbl-l" text-anchor="middle" font-size="13">filtered queue</text>

<rect x="150" y="1315" width="360" height="95" rx="9" fill="#ffffff" stroke="#000" stroke-width="2.2"/>
<text x="330" y="1355" class="box-title" font-size="20">Analyst</text>
<text x="330" y="1382" class="box-sub" font-size="15">Human review</text>

<g transform="translate(90,1500)">
  <rect x="0" y="0" width="42" height="24" rx="5" fill="none" stroke="#000" stroke-width="1.8" stroke-dasharray="7,4"/>
  <text x="50" y="17" class="lbl-l" font-size="14">Frozen / external</text>

  <rect x="0" y="38" width="42" height="24" rx="5" fill="none" stroke="#000" stroke-width="1.8"/>
  <text x="50" y="55" class="lbl-l" font-size="14">GuardLens core (real-time)</text>

  <rect x="0" y="76" width="42" height="24" rx="5" fill="none" stroke="#000" stroke-width="1.8" stroke-dasharray="2,3"/>
  <text x="50" y="93" class="lbl-l" font-size="14">Optional / asynchronous</text>

  <line x1="0" y1="122" x2="42" y2="122" stroke="#000" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="50" y="127" class="lbl-l" font-size="14">Feedback / optional path</text>
</g>
</svg>
