<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="'Times New Roman', Times, serif" role="img">
  <title>Table II: Detection Rate and Latency Across Three Blind-Spot Regimes</title>
  <desc>IEEE-style table comparing GuardLens against four baselines (Random Audit, Stratified Random, MMD Drift, One-Shot Cluster) across three attack-emergence regimes, reporting detection rate, median latency in cycles, purity at detection, and coverage at detection.</desc>

  <style>
    .cap { font-size: 12px; fill: #000000; }
    .cap-b { font-size: 12px; font-weight: bold; fill: #000000; }
