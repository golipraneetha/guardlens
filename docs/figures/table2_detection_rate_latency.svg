    .cell { font-size: 10.5px; fill: #000000; }
    .cell-b { font-size: 10.5px; font-weight: bold; fill: #000000; }
    .regime { font-size: 10px; font-weight: bold; fill: #000000; }
    .regime-sub { font-size: 9px; font-style: italic; fill: #333333; }
    .note { font-size: 9px; font-style: italic; fill: #333333; }
    .ruleThick { stroke: #000000; stroke-width: 1.6; }
    .ruleMed { stroke: #000000; stroke-width: 1.1; }
    .ruleThin { stroke: #999999; stroke-width: 0.75; }
  </style>

  <!-- Caption (above table, IEEE convention) -->
  <text x="380" y="26" text-anchor="middle" class="cap"><tspan class="cap-b">TABLE II.</tspan>  DETECTION RATE AND LATENCY ACROSS THREE BLIND-SPOT REGIMES (5 SEEDS)</text>

