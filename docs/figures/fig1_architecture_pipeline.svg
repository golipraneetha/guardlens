<svg viewBox="0 0 780 940" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Times New Roman', Times, serif">
  <title>GuardLens architecture pipeline</title>
  <desc>Data flow from incoming user prompts through a frozen safety guardrail, then through GuardLens stages: embedding, sliding window buffer, HDBSCAN clustering, cluster registry, emergence scoring, top-K analyst queue, and optional LLM verification.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .box-guardrail { fill: #f2f2f2; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .box-guardlens { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
    .box-optional { fill: #ffffff; stroke: #000000; stroke-width: 1.1; stroke-dasharray: 1.5 2.5; }
    .title { font-size: 14px; font-weight: bold; fill: #000000; }
    .subtitle { font-size: 11.5px; fill: #000000; font-style: italic; }
    .caption { font-size: 11px; fill: #000000; font-style: italic; }
    .arrow { stroke: #000000; stroke-width: 1.3; fill: none; }
    .arrow-dashed { stroke: #000000; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
    .section-label { font-size: 10.5px; fill: #000000; font-weight: bold; letter-spacing: 0.5px; }
    .figcap { font-size: 10.5px; fill: #000000; }
  </style>

  <!-- ────────── Input ────────── -->
  <text x="390" y="34" text-anchor="middle" class="title" font-size="13">Incoming User Prompts</text>
  <line x1="390" y1="46" x2="390" y2="72" class="arrow" marker-end="url(#arrow)"/>

  <!-- ────────── Frozen Guardrail ────────── -->
  <rect x="240" y="76" width="300" height="62" rx="2" class="box-guardrail"/>
  <text x="390" y="102" text-anchor="middle" class="title">Existing Safety Guardrail Classifier</text>
  <text x="390" y="122" text-anchor="middle" class="subtitle">Frozen · DeBERTa Prompt Injection v2</text>

  <!-- Blocked branch -->
  <path d="M240,107 L165,107 L165,148" class="arrow" marker-end="url(#arrow)"/>
  <text x="165" y="163" text-anchor="middle" class="subtitle">Blocked</text>
  <text x="165" y="178" text-anchor="middle" class="subtitle">(discarded)</text>

  <!-- Approved traffic to GuardLens -->
  <line x1="390" y1="138" x2="390" y2="176" class="arrow" marker-end="url(#arrow)"/>
  <text x="405" y="160" class="caption">Approved traffic</text>

  <!-- ────────── GuardLens boundary ────────── -->
  <rect x="60" y="188" width="660" height="560" rx="2"
        fill="none" stroke="#000000" stroke-width="0.9" stroke-dasharray="6 4"/>
  <text x="76" y="207" class="section-label">GUARDLENS &#8212; POST-DEPLOYMENT MONITORING LAYER</text>

  <!-- Stage 1: Embedding -->
  <rect x="240" y="222" width="300" height="66" rx="2" class="box-guardlens"/>
  <text x="390" y="248" text-anchor="middle" class="title">Sentence Embedding Model</text>
  <text x="390" y="268" text-anchor="middle" class="subtitle">all-MiniLM-L6-v2 · 384-dim, L2-normalized</text>
  <line x1="390" y1="288" x2="390" y2="314" class="arrow" marker-end="url(#arrow)"/>

  <!-- Stage 2: Sliding Window -->
  <rect x="240" y="316" width="300" height="66" rx="2" class="box-guardlens"/>
  <text x="390" y="342" text-anchor="middle" class="title">Sliding Window Buffer</text>
  <text x="390" y="362" text-anchor="middle" class="subtitle">Last W = 3 cycles of approved traffic</text>
  <line x1="390" y1="382" x2="390" y2="408" class="arrow" marker-end="url(#arrow)"/>

  <!-- Stage 3: HDBSCAN -->
  <rect x="240" y="410" width="300" height="66" rx="2" class="box-guardlens"/>
  <text x="390" y="436" text-anchor="middle" class="title">HDBSCAN Semantic Clustering</text>
  <text x="390" y="456" text-anchor="middle" class="subtitle">min_cluster_size = 5 · EOM selection</text>
  <line x1="390" y1="476" x2="390" y2="502" class="arrow" marker-end="url(#arrow)"/>

  <!-- Stage 4: Cluster Registry -->
  <rect x="240" y="504" width="300" height="66" rx="2" class="box-guardlens"/>
  <text x="390" y="530" text-anchor="middle" class="title">Cluster Registry</text>
  <text x="390" y="550" text-anchor="middle" class="subtitle">Cross-cycle identity via cosine &#8805; 0.85</text>
  <line x1="390" y1="570" x2="390" y2="596" class="arrow" marker-end="url(#arrow)"/>

  <!-- Historical feedback loop from Registry to Emergence (novelty) -->
  <path d="M540,537 C620,537 620,632 570,632" class="arrow-dashed" marker-end="url(#arrow)"/>
  <text x="626" y="588" class="caption">historical</text>
  <text x="626" y="602" class="caption">centroids</text>

  <!-- Stage 5: Emergence Score -->
  <rect x="240" y="598" width="300" height="66" rx="2" class="box-guardlens"/>
  <text x="390" y="624" text-anchor="middle" class="title">Emergence Score</text>
  <text x="390" y="644" text-anchor="middle" class="subtitle">E = Density &#215; max(Growth, 0.1) &#215; Novelty</text>
  <line x1="390" y1="664" x2="390" y2="690" class="arrow" marker-end="url(#arrow)"/>

  <!-- Stage 6: Top-K Analyst Queue -->
  <rect x="240" y="692" width="300" height="46" rx="2" class="box-guardlens"/>
  <text x="390" y="712" text-anchor="middle" class="title">Top-K Analyst Review Queue</text>
  <text x="390" y="730" text-anchor="middle" class="subtitle">Fixed budget · K = 3 clusters / cycle</text>

  <!-- Analyst path -->
  <path d="M240,715 L110,715 L110,782" class="arrow" marker-end="url(#arrow)"/>
  <text x="110" y="800" text-anchor="middle" class="title" font-size="13">Analyst</text>
  <text x="110" y="817" text-anchor="middle" class="subtitle">Human review</text>

  <!-- Optional LLM Verification -->
  <line x1="540" y1="715" x2="590" y2="715" class="arrow-dashed" marker-end="url(#arrow)"/>
  <rect x="590" y="686" width="180" height="60" rx="2" class="box-optional"/>
  <text x="680" y="708" text-anchor="middle" class="title" font-size="13">LLM Verifier</text>
  <text x="680" y="724" text-anchor="middle" class="subtitle">Optional · Qwen3-1.7B</text>
  <text x="680" y="738" text-anchor="middle" class="subtitle">THREAT / BENIGN</text>

  <!-- Filtered queue back to analyst -->
  <path d="M680,746 L680,782 L110,782" class="arrow-dashed" marker-end="url(#arrow)"/>
  <text x="395" y="775" text-anchor="middle" class="caption">filtered queue (precision &#8593;, latency unchanged)</text>

  <!-- Legend (line-style, not color) -->
  <g transform="translate(60, 848)">
    <rect x="0" y="0" width="18" height="12" rx="1" class="box-guardrail"/>
    <text x="24" y="10" class="subtitle" font-style="normal">Frozen / external</text>

    <rect x="150" y="0" width="18" height="12" rx="1" class="box-guardlens"/>
    <text x="174" y="10" class="subtitle" font-style="normal">GuardLens core (real-time)</text>

    <rect x="360" y="0" width="18" height="12" rx="1" class="box-optional"/>
    <text x="384" y="10" class="subtitle" font-style="normal">Optional / asynchronous</text>

    <line x1="540" y1="6" x2="580" y2="6" class="arrow-dashed"/>
    <text x="586" y="10" class="subtitle" font-style="normal">feedback / optional path</text>
  </g>

  <!-- Figure caption (IEEE convention: caption below figure, regular weight) -->
  <text x="390" y="890" text-anchor="middle" class="figcap">Fig. 1.  GuardLens architecture. Approved traffic is embedded, clustered within a sliding</text>
  <text x="390" y="904" text-anchor="middle" class="figcap">window, tracked by a persistent Cluster Registry, and ranked by an Emergence Score before</text>
  <text x="390" y="918" text-anchor="middle" class="figcap">reaching a fixed-budget analyst queue, with optional LLM verification downstream.</text>
</svg>
